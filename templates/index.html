<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown Timer Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-hourglass-half"></i> Countdown Timer Viewer</h1>
        <p class="subtitle">Set a deadline and feel the pressure tick closer.</p>
        <form action="/countdown" method="post" id="countdown-form">
            <label for="deadline">Enter Deadline:</label>
            <input type="datetime-local" id="deadline" name="deadline" required>
          <input type="hidden" id="deadline-utc" name="deadline_utc">
          <input type="hidden" id="timezone" name="timezone">
          <input type="hidden" id="timezone-offset" name="timezone_offset">
            <button type="submit"><i class="fas fa-play"></i> Start Countdown</button>
        </form>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
    <script>
      document.getElementById("countdown-form").addEventListener("submit", function() {
        var deadlineInput = document.getElementById("deadline").value;
        if (!deadlineInput) {
          return;
        }
        var localDate = new Date(deadlineInput);
        document.getElementById("deadline-utc").value = localDate.toISOString();
        document.getElementById("timezone").value = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local";
        document.getElementById("timezone-offset").value = localDate.getTimezoneOffset();
      });
    </script>
</body>
</html>
